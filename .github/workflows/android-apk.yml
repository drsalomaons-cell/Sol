name: Sol Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter project
        run: flutter create . --platforms=android --project-name sol
      - name: Verify Sol source
        run: |
          test -s lib/main.dart
          grep -q "class SolApp" lib/main.dart
          grep -q "class SolHome" lib/main.dart
          echo "Sol source OK"
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sol-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
